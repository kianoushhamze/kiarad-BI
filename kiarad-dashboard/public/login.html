<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کیاراد شفا اندیش | ورود</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@200;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080f;--surface:#0f1222;--surface2:#161a30;--stroke:rgba(255,255,255,.08);
--violet:#4f5fc4;--indigo:#3a4aa8;--emerald:#12a57a;--text:#e8eaf6;--muted:#9aa0c3;--font:'Vazirmatn',Tahoma,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;
display:flex;align-items:center;justify-content:center;line-height:1.7;font-size:15px;
background-image:radial-gradient(700px 420px at 85% -5%,rgba(79,95,196,.15),transparent 65%),
radial-gradient(600px 400px at 5% 105%,rgba(99,102,241,.10),transparent 60%);background-attachment:fixed}
.card{width:min(420px,92vw);background:var(--surface);border:1px solid var(--stroke);border-radius:20px;padding:36px 32px}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:26px;text-align:center}
.brand b{font-weight:800;font-size:19px}
.brand small{color:var(--muted);font-weight:200;font-size:12px}
h1{font-size:18px;font-weight:600;text-align:center;margin-bottom:18px}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
input{width:100%;background:var(--surface2);border:1px solid var(--stroke);color:var(--text);font-family:var(--font);
font-size:15px;border-radius:12px;padding:12px 14px;margin-bottom:14px}
input:focus{outline:2px solid var(--violet);outline-offset:1px}
.password-wrap{position:relative}
.password-wrap input{padding-left:70px}
.show-password{position:absolute;left:8px;top:6px;border:0;border-radius:8px;padding:7px 10px;background:transparent;color:var(--muted);font-family:var(--font);cursor:pointer}
.show-password:focus-visible{outline:2px solid var(--violet)}
.recovery-link{display:block;margin-top:12px;text-align:center;color:#aab7ff;text-decoration:none;font-size:13px}
.recovery-link:hover{text-decoration:underline}
.btn{width:100%;background:linear-gradient(135deg,var(--violet),var(--indigo));color:#fff;border:none;cursor:pointer;
font-family:var(--font);font-weight:600;font-size:15px;border-radius:12px;padding:13px;transition:filter .3s}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.55;cursor:wait}
.msg{border-radius:12px;padding:11px 15px;font-size:13px;margin-bottom:14px;display:none}
.msg.err{background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.3);color:#fca5a5;display:block}
.msg.ok{background:rgba(18,165,122,.12);border:1px solid rgba(18,165,122,.35);color:#6ee7b7;display:block}
.hint{text-align:center;color:var(--muted);font-size:11.5px;font-weight:200;margin-top:18px}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <svg width="58" height="58" viewBox="0 0 64 64" role="img" aria-label="لوگوی کیاراد">
      <defs><linearGradient id="kg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5df0"/><stop offset="1" stop-color="#2e4a8f"/></linearGradient></defs>
      <circle cx="32" cy="32" r="29" fill="none" stroke="url(#kg)" stroke-width="1.6" opacity=".85"/>
      <path d="M20 14 L20 50 M20 33 C30 30 36 24 40 15 M20 33 C29 36 35 42 39 50"
            fill="none" stroke="url(#kg)" stroke-width="6.5" stroke-linecap="round"/>
      <path d="M41 44 C46 40 50 39 53 40 C52 46 48 49 42 49 C41.6 47.5 41 45.5 41 44 Z" fill="#10b981"/>
    </svg>
    <div><b>کیاراد شفا اندیش</b><small>پنل فرماندهی هوش تجاری</small></div>
  </div>
  <h1>ورود به سیستم</h1>
  <div class="msg" id="msg"></div>
  <form id="f">
    <label>نام کاربری</label>
    <input id="u" autocomplete="username" placeholder="مثلاً manager">
    <label>رمز عبور</label>
    <div class="password-wrap">
      <input id="p" type="password" autocomplete="current-password" placeholder="••••••••">
      <button class="show-password" id="show-password" type="button" aria-controls="p" aria-label="نمایش رمز عبور" aria-pressed="false">نمایش</button>
    </div>
    <button class="btn" id="b" type="submit">ورود</button>
  </form>
  <a class="recovery-link" href="/forgot-password.html">رمز عبور را فراموش کرده‌ام</a>
  <p class="hint">ورود موفق → پنل فرماندهی</p>
</div>
<script>
(function(){
  "use strict";
  var REAL = "kiarad_access_token";
  var f = document.getElementById("f");
  var u = document.getElementById("u");
  var p = document.getElementById("p");
  var showPassword = document.getElementById("show-password");
  var b = document.getElementById("b");
  var msg = document.getElementById("msg");
  function show(cls, t){ msg.className = "msg " + cls; msg.textContent = t; }
  showPassword.addEventListener("click", function(){
    var visible = p.type === "password";
    p.type = visible ? "text" : "password";
    showPassword.textContent = visible ? "پنهان" : "نمایش";
    showPassword.setAttribute("aria-label", visible ? "پنهان کردن رمز عبور" : "نمایش رمز عبور");
    showPassword.setAttribute("aria-pressed", String(visible));
  });
  try{
    var existing = window.localStorage.getItem(REAL);
    if (existing){
      fetch("/api/auth/me", { headers: { "Authorization": "Bearer " + existing }, cache: "no-store" })
        .then(function(r){
          if (r.ok){ window.location.replace("/newdash_online.html"); return; }
          if (r.status === 401 || r.status === 403){
            window.localStorage.removeItem(REAL);
            window.localStorage.removeItem("kiarad_session_user");
          }
        })
        .catch(function(){ show("err", "ارتباط با سرور برقرار نشد؛ دوباره تلاش کن."); });
    }
  }catch(e){}
  f.addEventListener("submit", function(ev){
    ev.preventDefault();
    var un = (u.value || "").trim();
    var pw = (p.value || "");
    if (!un || !pw){ show("err", "نام کاربری و رمز را وارد کن."); return; }
    b.disabled = true; b.textContent = "در حال ورود…";
    msg.className = "msg";
    var api = window.location.origin + "/api";
    fetch(api + "/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: un, password: pw })
    })
    .then(function(r){
      if (r.status === 401 || r.status === 400){ throw new Error("نام کاربری یا رمز عبور اشتباه است."); }
      if (!r.ok){ throw new Error("سرور پاسخ " + r.status + " داد — کمی بعد دوباره تلاش کن."); }
      return r.json();
    })
    .then(function(d){
      var tok = d.token || d.access_token || (d.data && d.data.token) || (d.data && d.data.access_token) || "";
      if (!tok){ throw new Error("پاسخ سرور توکن نداشت — به مدیر سیستم خبر بده."); }
      var usr = d.user || (d.data && d.data.user) || { username: un };
      try{
        window.localStorage.setItem(REAL, tok);
        window.localStorage.setItem("kiarad_session_user", JSON.stringify(usr));
      }catch(e){}
      show("ok", "خوش آمدی! در حال رفتن به پنل فرماندهی…");
      setTimeout(function(){ window.location.href = (window.location.protocol === "https:") ? "/newdash_online.html" : "/newdash_online.html"; }, 600);
    })
    .catch(function(e){
      var t = (e && e.message) ? e.message : "خطای شبکه";
      if (t.indexOf("Failed to fetch") !== -1){ t = "به سرور نرسید — یک‌بار «Kiarad Start» را اجرا کن و دوباره تلاش کن."; }
      show("err", t);
      b.disabled = false; b.textContent = "ورود";
    });
  });
})();
</script>
</body>
</html>
