<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کیاراد شفا اندیش | بازیابی رمز</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080910;color:#e8eaf6;font:15px/1.8 Tahoma,sans-serif}
.card{width:min(430px,92vw);padding:32px;background:#111422;border:1px solid #2b3045;border-radius:20px}
h1{font-size:21px;margin:0 0 10px}.muted{color:#a1a8c5;font-size:13px}label{display:block;margin:22px 0 7px;font-size:13px}
input{width:100%;padding:13px;border:1px solid #3b4364;border-radius:10px;background:#1a1e32;color:#fff;font:inherit;direction:ltr;text-align:left}
button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:#6257d8;color:#fff;font:inherit;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}a{color:#b5adff}.message{display:none;margin-top:15px;padding:12px;border-radius:10px;background:#232746}.message.visible{display:block}
</style>
</head>
<body>
<main class="card">
  <h1>بازیابی رمز عبور</h1>
  <p class="muted">ایمیل ثبت‌شده برای حساب خود را وارد کنید. اگر حسابی با این ایمیل وجود داشته باشد، پیوند یک‌بارمصرف بازیابی فرستاده می‌شود.</p>
  <form id="recovery-form">
    <label for="email">ایمیل بازیابی</label>
    <input id="email" type="email" autocomplete="email" required placeholder="name@example.com">
    <button id="submit" type="submit">ارسال پیوند بازیابی</button>
  </form>
  <div class="message" id="message" role="status" aria-live="polite"></div>
  <p class="muted">بازیابی با شماره همراه پس از اتصال سرویس پیامک فعال می‌شود.</p>
  <a href="/login.html">بازگشت به ورود</a>
</main>
<script>
(function(){
  var form=document.getElementById('recovery-form');
  var button=document.getElementById('submit');
  var message=document.getElementById('message');
  form.addEventListener('submit',function(event){
    event.preventDefault();
    button.disabled=true;
    message.className='message';
    fetch('/api/auth/recovery/request',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:document.getElementById('email').value.trim()})
    }).then(function(response){
      if(response.status===503) throw new Error('ارسال ایمیل هنوز راه‌اندازی نشده است. با مدیر سامانه تماس بگیرید.');
      if(!response.ok) throw new Error('درخواست انجام نشد. کمی بعد دوباره تلاش کنید.');
      message.textContent='اگر ایمیل در سامانه ثبت شده باشد، پیوند بازیابی برای آن فرستاده شد.';
      message.className='message visible';
    }).catch(function(error){
      message.textContent=error.message||'ارتباط با سرور برقرار نشد.';
      message.className='message visible';
    }).finally(function(){button.disabled=false;});
  });
})();
</script>
</body>
</html>
