<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کیاراد شفا اندیش | رمز جدید</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080910;color:#e8eaf6;font:15px/1.8 Tahoma,sans-serif}
.card{width:min(430px,92vw);padding:32px;background:#111422;border:1px solid #2b3045;border-radius:20px}
h1{font-size:21px;margin:0 0 10px}.muted{color:#a1a8c5;font-size:13px}label{display:block;margin:20px 0 7px;font-size:13px}
input{width:100%;padding:13px;border:1px solid #3b4364;border-radius:10px;background:#1a1e32;color:#fff;font:inherit;direction:ltr;text-align:left}
button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:#6257d8;color:#fff;font:inherit;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}a{color:#b5adff}.message{display:none;margin-top:15px;padding:12px;border-radius:10px;background:#232746}.message.visible{display:block}
</style>
</head>
<body>
<main class="card">
  <h1>تنظیم رمز جدید</h1>
  <p class="muted">رمزی با دست‌کم ۱۲ نویسه انتخاب کنید. پیوند بازیابی فقط یک بار و تا ۱۵ دقیقه معتبر است.</p>
  <form id="reset-form">
    <label for="password">رمز جدید</label>
    <input id="password" type="password" autocomplete="new-password" minlength="12" required>
    <label for="confirm">تکرار رمز جدید</label>
    <input id="confirm" type="password" autocomplete="new-password" minlength="12" required>
    <button id="submit" type="submit">ثبت رمز جدید</button>
  </form>
  <div class="message" id="message" role="status" aria-live="polite"></div>
  <p><a href="/login.html">بازگشت به ورود</a></p>
</main>
<script>
(function(){
  var token=new URLSearchParams(location.hash.slice(1)).get('token')||'';
  history.replaceState(null,'',location.pathname);
  var form=document.getElementById('reset-form');
  var button=document.getElementById('submit');
  var message=document.getElementById('message');
  function show(text){message.textContent=text;message.className='message visible';}
  if(!token){form.hidden=true;show('پیوند بازیابی نامعتبر است. دوباره درخواست بدهید.');return;}
  form.addEventListener('submit',function(event){
    event.preventDefault();
    var password=document.getElementById('password').value;
    if(password!==document.getElementById('confirm').value){show('تکرار رمز با رمز جدید یکسان نیست.');return;}
    button.disabled=true;
    fetch('/api/auth/recovery/confirm',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:token,new_password:password})
    }).then(function(response){
      if(!response.ok) throw new Error('پیوند منقضی یا استفاده شده است. دوباره درخواست بدهید.');
      token='';form.hidden=true;show('رمز تغییر کرد. اکنون می‌توانید وارد شوید.');
    }).catch(function(error){show(error.message||'ارتباط با سرور برقرار نشد.');})
      .finally(function(){button.disabled=false;});
  });
})();
</script>
</body>
</html>
