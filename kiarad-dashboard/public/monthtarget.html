<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کیاراد | تنظیم تارگت ماهانه</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@200;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a12;--surface:#12121e;--surface2:#181828;--stroke:rgba(255,255,255,.08);
--violet:#8b5cf6;--violet-soft:rgba(139,92,246,.16);--emerald:#10b981;--gold:#d9a441;--text:#e9e9f4;--muted:#9a9ab4;--font:'Vazirmatn',Tahoma,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.7;font-size:15px;
background-image:radial-gradient(700px 420px at 85% -5%,rgba(139,92,246,.13),transparent 65%);background-attachment:fixed}
.wrap{max-width:860px;margin:0 auto;padding:24px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
a.back{color:var(--violet);text-decoration:none;font-size:13px;border:1px solid var(--stroke);border-radius:9999px;padding:6px 16px}
a.back:hover{border-color:var(--violet)}
h1{font-size:clamp(22px,3.5vw,30px);font-weight:800;margin-bottom:6px}
.sub{color:var(--muted);font-weight:200;margin-bottom:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.card{background:var(--surface);border:1px solid var(--stroke);border-radius:16px;padding:24px}
.card h2{font-size:15px;font-weight:600;margin-bottom:14px}
.bignum{font-size:clamp(24px,3vw,32px);font-weight:800;margin:4px 0}
.rowline{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:7px 0;border-bottom:1px solid var(--stroke)}
.rowline:last-of-type{border-bottom:none}
.rowline b{color:var(--text);font-weight:600}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input{width:100%;background:var(--surface2);border:1px solid var(--stroke);color:var(--text);font-family:var(--font);
font-size:16px;border-radius:12px;padding:12px 14px;margin-bottom:12px}
input:focus{outline:2px solid var(--violet);outline-offset:1px}
.btn{background:linear-gradient(135deg,var(--violet),#6366f1);color:#fff;border:none;cursor:pointer;
font-family:var(--font);font-weight:600;font-size:14px;border-radius:12px;padding:12px 20px;transition:filter .3s}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;border:1px solid var(--stroke);color:var(--violet);font-weight:400}
.msg{border-radius:12px;padding:12px 16px;font-size:13px;margin-bottom:14px;display:none}
.msg.ok{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.35);color:#6ee7b7;display:block}
.msg.err{background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.3);color:#fca5a5;display:block}
.hist{font-size:13px}
.hist .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--stroke)}
.hist .row:last-child{border-bottom:none}
.hist .amt{font-weight:600}
.hist .st{font-size:11px;border-radius:9999px;padding:2px 10px}
.hist .st.active{background:rgba(16,185,129,.14);color:#6ee7b7}
.hist .st.archived{background:rgba(255,255,255,.05);color:var(--muted)}
@media(max-width:720px){.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="/newdash.html">← بازگشت به پنل فرماندهی</a></div>
  <h1>تنظیم تارگت ماهانه‌ی شرکت</h1>
  <p class="sub">هر اول ماه فقط یک‌بار وارد کن — پیشنهاد سیستم: ۲۰٪ بیشتر از ماه قبل</p>
  <div class="msg" id="msg"></div>

  <section class="grid g2">
    <article class="card">
      <h2>تارگت فعال</h2>
      <div class="bignum" id="act">…</div>
      <div class="rowline"><span>فروش همین ماه</span><b id="ms">…</b></div>
      <div class="rowline"><span>تحقق</span><b id="ach">…</b></div>
    </article>
    <article class="card">
      <h2>ثبت تارگت ماه جدید (تومان)</h2>
      <label>مثلاً: 2000000000 یعنی ۲ میلیارد تومان</label>
      <input id="amt" type="text" inputmode="numeric" placeholder="مقدار به تومان">
      <button class="btn ghost" id="btn-sugg" type="button">پیشنهاد: ۲۰٪ بیشتر از ماه قبل</button>
      <br><br>
      <button class="btn" id="btn-save" type="button">ثبت تارگت جدید</button>
    </article>
  </section>

  <section class="card" style="margin-top:16px">
    <h2>تاریخچه‌ی تارگت‌های شرکت</h2>
    <div class="hist" id="hist">در حال خواندن…</div>
  </section>
</div>

<script>
(function(){
  "use strict";
  var REAL = "kiarad_access_token";
  function fmt(n){ try{ return Number(n).toLocaleString("fa-IR"); }catch(e){ return String(n); } }
  function tom(n){ return fmt(Math.round(Number(n)/10)) + " تومان"; }
  function msg(ok, t){ var m = document.getElementById("msg"); m.className = "msg " + (ok ? "ok" : "err"); m.textContent = t; }
  var tok = "";
  try{ tok = window.localStorage.getItem(REAL) || ""; }catch(e){}
  if (!tok){ msg(false, "اول از /login وارد شو."); return; }
  var api = "http://" + window.location.hostname + ":8000";
  var headers = { "Content-Type": "application/json", "Authorization": "Bearer " + tok };
  var lastActive = 0;

  function load(){
    fetch(api + "/targets/company", { headers: headers, cache: "no-store" })
      .then(function(r){ if (r.status === 401){ throw new Error("توکن منقضی — یک‌بار دیگر از /login وارد شو."); } return r.json(); })
      .then(function(d){
        lastActive = d.active_target || 0;
        document.getElementById("act").textContent = tom(lastActive);
        document.getElementById("ms").textContent = tom(d.month_sales || 0);
        document.getElementById("ach").textContent = (d.achievement_percent || 0) + "٪";
        var h = document.getElementById("hist"), out = "";
        (d.items || []).forEach(function(r){
          out = out + '<div class="row"><span>' + (r.title || "-") + '</span><span><span class="amt">' + tom(r.target_amount) +
            '</span> <span class="st ' + (r.status === "active" ? "active" : "archived") + '">' +
            (r.status === "active" ? "فعال" : "بایگانی") + '</span></span></div>';
        });
        h.innerHTML = out || "هنوز تارگتی ثبت نشده";
      })
      .catch(function(e){ msg(false, e.message || "خطای اتصال"); });
  }
  document.getElementById("btn-sugg").addEventListener("click", function(){
    var sug = lastActive > 0 ? lastActive * 1.2 : 20000000000;
    document.getElementById("amt").value = String(Math.round(sug / 10));
  });
  document.getElementById("btn-save").addEventListener("click", function(){
    var raw = (document.getElementById("amt").value || "").replace(/[^\d]/g, "");
    if (!raw){ msg(false, "مقدار را وارد کن."); return; }
    var toman = Number(raw);
    fetch(api + "/targets/company", { method: "POST", headers: headers, body: JSON.stringify({ amount_toman: toman }) })
      .then(function(r){ if (!r.ok){ throw new Error("ثبت نشد (کد " + r.status + ")"); } return r.json(); })
      .then(function(d){ msg(true, "ثبت شد: " + tom(d.target_rial) + " — از این لحظه تحقق داشبورد روی همین عدد حساب می‌شود."); load(); })
      .catch(function(e){ msg(false, e.message || "خطا"); });
  });
  load();
})();
</script>
</body>
</html>
