services:
  postgres:
    image: postgres:16
    container_name: kiarad-postgres
    restart: always
    environment:
      POSTGRES_USER: kiarad
      POSTGRES_PASSWORD: kiarad123
      POSTGRES_DB: kiaradbi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: kiarad-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@kiarad.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"

volumes:
  postgres_data:
