name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-offline-tests:
    name: Backend offline test subset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Run offline test subset
        run: python scripts/run_offline_review_tests.py

  frontend-build:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kiarad-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kiarad-dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Frontend unit checks
        run: |
          for test in scripts/test-*.cjs; do
            node "$test" || exit 1
          done
      - name: Lint
        run: npm run lint
      - name: Generate Next route types
        run: npx next typegen
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        env:
          KIARAD_API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build


  cms-and-storefront-regressions:
    name: CMS PostgreSQL and storefront regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kiarad
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: kiaradbi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiarad -d kiaradbi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: kiarad
      DB_NAME: kiaradbi
      POSTGRES_PASSWORD: ci-only-password
      KIARAD_REVIEW_DISPOSABLE_DB: '1'
      KIARAD_TEST_CMS_DB: '1'
      KIARAD_TEST_TASK_WORKFLOW_DB: '1'
      KIARAD_TEST_STOREFRONT_DB: '1'
      HOLO_API_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: PostgreSQL isolated-schema regressions
        run: |
          python scripts/run_database_review_tests.py
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $issues = @()
          foreach ($file in Get-ChildItem -Recurse -Filter '*.ps1') {
            $tokens = $null; $parseErrors = $null
            [Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            $issues += $parseErrors
          }
          if ($issues.Count) { $issues | Format-List; exit 1 }
      - name: Backup and restore integration
        shell: pwsh
        env:
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: ./tests/test_transfer_backups.ps1 -PostgresContainer $env:TEST_POSTGRES_CONTAINER -DisposableDatabase
      - name: Storefront regressions with mock upstream
        run: |
          for test in tests/node/*.mjs; do
            node "$test" || exit 1
          done

  storefront-browser:
    name: Storefront browser at mobile and desktop widths
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.65.0
      - run: python -m playwright install --with-deps chromium
      - name: Responsive registration and checkout against mock API
        run: python tests/browser/check_mobile_storefront.py

  mobile-android:
    name: Android pilot APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Compile organizational pilot APK
        run: ./gradlew --no-daemon assembleDebug -PreactNativeArchitectures=arm64-v8a,x86_64
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: Kiarad-Android-Pilot
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  mobile-ios:
    name: iOS simulator build (device signing separate)
    runs-on: macos-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: Generate native iOS project and Pods
        run: npx expo prebuild --platform ios
      - name: Compile unsigned simulator app
        run: xcodebuild -workspace ios/KiaradField.xcworkspace -scheme KiaradField -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/kiarad-ios" CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app and signing instructions
        run: |
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/kiarad-ios/Build/Products/Debug-iphonesimulator/KiaradField.app" "$RUNNER_TEMP/Kiarad-iOS-Simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Kiarad-iOS-Simulator
          path: ${{ runner.temp }}/Kiarad-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 30

  training-manual:
    name: Persian PDF handbook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - name: Render handbook with local Persian fonts
        run: python scripts/build_training_pdf.py --output "$RUNNER_TEMP/handbook"
      - uses: actions/upload-artifact@v4
        with:
          name: Kiarad-Training-Manual
          path: ${{ runner.temp }}/handbook/
          if-no-files-found: error
          retention-days: 30

  transfer-kit:
    name: Build and verify transfer kit
    needs: [backend-offline-tests, frontend-build, cms-and-storefront-regressions, storefront-browser, mobile-android, mobile-ios, training-manual]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build kit from exact checked-out Git tree
        run: python scripts/build_transfer_kit.py --output "$RUNNER_TEMP/Kiarad-Transfer-20261113"
      - name: Download same-run manuals and mobile artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Kiarad-{Training-Manual,Android-Pilot,iOS-Simulator}
          path: ${{ runner.temp }}/release-extras
      - name: Attach checksummed mobile and training deliverables
        run: python scripts/attach_release_extras.py --kit "$RUNNER_TEMP/Kiarad-Transfer-20261113" --extras "$RUNNER_TEMP/release-extras"
      - name: Verify kit and guards
        shell: pwsh
        run: ./tests/test_transfer_kit.ps1 -KitRoot (Join-Path $env:RUNNER_TEMP 'Kiarad-Transfer-20261113') -DockerGuards
      - name: Upload private repository transfer artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Kiarad-Transfer-20261113
          path: ${{ runner.temp }}/Kiarad-Transfer-20261113/
          if-no-files-found: error
          retention-days: 30

  offline-images:
    name: Build Linux images and verify offline stack
    if: github.ref == 'refs/heads/main'
    needs: [transfer-kit]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build images, smoke test containers and export exact release
        run: bash scripts/ci_build_offline_transfer.sh
      - name: Download same-run manuals and mobile artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Kiarad-{Training-Manual,Android-Pilot,iOS-Simulator}
          path: ${{ runner.temp }}/release-extras
      - name: Attach checksummed mobile and training deliverables
        run: python scripts/attach_release_extras.py --kit "$RUNNER_TEMP/Kiarad-Transfer-20261113-Offline" --extras "$RUNNER_TEMP/release-extras"
      - name: Verify offline kit and guards
        shell: pwsh
        run: ./tests/test_transfer_kit.ps1 -KitRoot (Join-Path $env:RUNNER_TEMP 'Kiarad-Transfer-20261113-Offline') -DockerGuards
      - name: Upload private offline transfer kit
        uses: actions/upload-artifact@v4
        with:
          name: Kiarad-Transfer-20261113-Offline
          path: ${{ runner.temp }}/Kiarad-Transfer-20261113-Offline/
          if-no-files-found: error
          retention-days: 7
