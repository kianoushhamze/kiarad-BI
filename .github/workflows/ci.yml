name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-offline-tests:
    name: Backend offline test subset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Run offline test subset
        run: python scripts/run_offline_review_tests.py

  frontend-build:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kiarad-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kiarad-dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Frontend unit checks
        run: |
          for test in scripts/test-*.cjs; do
            node "$test" || exit 1
          done
      - name: Lint
        run: npm run lint
      - name: Generate Next route types
        run: npx next typegen
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        env:
          KIARAD_API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build


  cms-and-storefront-regressions:
    name: CMS PostgreSQL and storefront regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kiarad
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: kiaradbi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiarad -d kiaradbi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: kiarad
      DB_NAME: kiaradbi
      POSTGRES_PASSWORD: ci-only-password
      KIARAD_REVIEW_DISPOSABLE_DB: '1'
      KIARAD_TEST_CMS_DB: '1'
      KIARAD_TEST_TASK_WORKFLOW_DB: '1'
      KIARAD_TEST_STOREFRONT_DB: '1'
      HOLO_API_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: PostgreSQL isolated-schema regressions
        run: |
          python scripts/run_database_review_tests.py
      - name: Real Traccar protocol to consented dashboard
        run: python scripts/ci_traccar_service.py
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $issues = @()
          foreach ($file in Get-ChildItem -Recurse -Filter '*.ps1') {
            $tokens = $null; $parseErrors = $null
            [Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            $issues += $parseErrors
          }
          if ($issues.Count) { $issues | Format-List; exit 1 }
      - name: Backup and restore integration
        shell: pwsh
        env:
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: ./tests/test_transfer_backups.ps1 -PostgresContainer $env:TEST_POSTGRES_CONTAINER -DisposableDatabase
      - name: Storefront regressions with mock upstream
        run: |
          for test in tests/node/*.mjs; do
            node "$test" || exit 1
          done

  storefront-browser:
    name: Storefront browser at mobile and desktop widths
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.65.0
      - run: python -m playwright install --with-deps chromium
      - name: Responsive registration and checkout against mock API
        run: python tests/browser/check_mobile_storefront.py

  training-manual:
    name: Persian PDF handbook
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - name: Render handbook with local Persian fonts
        run: python scripts/build_training_pdf.py --output "$RUNNER_TEMP/handbook"

  powershell-51-compat:
    name: Windows PowerShell 5.1 transfer-kit compatibility
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse every tracked PowerShell script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(git ls-files -- '*.ps1')
          if ($LASTEXITCODE -ne 0 -or $files.Count -eq 0) { throw 'Unable to enumerate tracked PowerShell scripts.' }
          $issues = @()
          foreach ($path in $files) {
            $fullPath = (Resolve-Path -LiteralPath $path).Path
            $tokens = $null; $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($fullPath, [ref]$tokens, [ref]$parseErrors)
            foreach ($issue in $parseErrors) { $issues += ($path + ': ' + $issue.Message) }
          }
          if ($issues.Count -gt 0) {
            $issues | ForEach-Object { Write-Error $_ }
            throw 'Windows PowerShell 5.1 parser rejected tracked scripts.'
          }
          Write-Output ("Parsed {0} tracked PowerShell files with Windows PowerShell {1}." -f $files.Count, $PSVersionTable.PSVersion)
      - name: Build a disposable transfer-kit fixture
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $kit = Join-Path $env:RUNNER_TEMP 'Kiarad-Transfer-PS51'
          python scripts/build_transfer_kit.py --output $kit
          if ($LASTEXITCODE -ne 0) { throw 'Transfer-kit fixture build failed.' }
          & .\tests\test_transfer_kit.ps1 -KitRoot $kit
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 transfer-kit guards failed.' }

  transfer-kit:
    permissions:
      contents: write
    name: Build and verify transfer kit
    needs: [backend-offline-tests, frontend-build, cms-and-storefront-regressions, storefront-browser, training-manual, powershell-51-compat]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build kit from exact checked-out Git tree
        run: python scripts/build_transfer_kit.py --output "$RUNNER_TEMP/Kiarad-Transfer-20261113"
      - name: Render same-source manual without Actions storage
        run: |
          pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          python scripts/build_training_pdf.py --output "$RUNNER_TEMP/release-extras/Kiarad-Training-Manual"
      - name: Attach checksummed training deliverables
        run: python scripts/attach_release_extras.py --kit "$RUNNER_TEMP/Kiarad-Transfer-20261113" --extras "$RUNNER_TEMP/release-extras"
      - name: Verify kit and guards
        shell: pwsh
        run: ./tests/test_transfer_kit.ps1 -KitRoot (Join-Path $env:RUNNER_TEMP 'Kiarad-Transfer-20261113') -DockerGuards
      - name: Archive verified package in a draft Release
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_ci_package.py --kit "$RUNNER_TEMP/Kiarad-Transfer-20261113"

  offline-images:
    permissions:
      contents: write
    name: Build Linux images and verify offline stack
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    needs: [transfer-kit]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build images, smoke test containers and export exact release
        run: bash scripts/ci_build_offline_transfer.sh
      - name: Render same-source manual without Actions storage
        run: |
          pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          python scripts/build_training_pdf.py --output "$RUNNER_TEMP/release-extras/Kiarad-Training-Manual"
      - name: Attach checksummed training deliverables
        run: python scripts/attach_release_extras.py --kit "$RUNNER_TEMP/Kiarad-Transfer-20261113-Offline" --extras "$RUNNER_TEMP/release-extras"
      - name: Verify offline kit and guards
        shell: pwsh
        run: ./tests/test_transfer_kit.ps1 -KitRoot (Join-Path $env:RUNNER_TEMP 'Kiarad-Transfer-20261113-Offline') -DockerGuards
      - name: Archive verified package in a draft Release
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_ci_package.py --kit "$RUNNER_TEMP/Kiarad-Transfer-20261113-Offline"
