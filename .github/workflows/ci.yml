name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-offline-tests:
    name: Backend offline test subset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Run offline test subset
        run: python scripts/run_offline_review_tests.py

  frontend-build:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kiarad-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kiarad-dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Next route types
        run: npx next typegen
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        env:
          KIARAD_API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build


  cms-and-storefront-regressions:
    name: CMS PostgreSQL and storefront regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kiarad
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: kiaradbi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiarad -d kiaradbi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: kiarad
      DB_NAME: kiaradbi
      POSTGRES_PASSWORD: ci-only-password
      KIARAD_TEST_CMS_DB: '1'
      KIARAD_TEST_TASK_WORKFLOW_DB: '1'
      KIARAD_TEST_STOREFRONT_DB: '1'
      HOLO_API_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: PostgreSQL isolated-schema regressions
        run: |
          python -m unittest discover -s tests -p 'test_site_cms_regressions.py' -v
          python -m unittest discover -s tests -p 'test_task_workflow.py' -v
          python -m unittest discover -s tests -p 'test_storefront_orders.py' -v
      - name: Storefront regressions with mock upstream
        run: |
          for test in tests/node/*.mjs; do
            node "$test" || exit 1
          done
