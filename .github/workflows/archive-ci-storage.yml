name: Archive protected CI packages outside Actions storage

on:
  push:
    branches: [codex/archive-ci-storage-20261115]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: archive-kiarad-ci-storage-20261115
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify existing packages, archive to draft Releases, then remove Actions copies
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/archive_ci_artifacts.py
