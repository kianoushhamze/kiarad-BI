# Merge into the company's existing HTTPS reverse proxy; substitute hostname/cert.
# Bind only port5055 on loopback; never expose a Traccar admin interface.
# http {} context:
limit_req_zone $binary_remote_addr zone=kiarad_gps:10m rate=5r/s;
server {
    listen 443 ssl;
    server_name gps.company.example;
    ssl_certificate /path/to/company/fullchain.pem;
    ssl_certificate_key /path/to/company/privkey.pem;
    client_max_body_size 8k;
    error_log /var/log/nginx/kiarad-gps-critical.log crit;
    access_log off; # Device identifiers and coordinates must not enter URL access logs.
    location / {
        limit_req zone=kiarad_gps burst=20 nodelay;
        proxy_pass http://127.0.0.1:5055;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
    }
}
